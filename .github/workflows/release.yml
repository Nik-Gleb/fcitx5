name: Release build

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            appstream cmake dbus-daemon extra-cmake-modules gettext \
            iso-codes libbrotli-dev libcairo2-dev libdbus-1-dev \
            libegl1-mesa-dev libenchant-2-dev libevent-dev libexpat1-dev \
            libfmt-dev libgdk-pixbuf-2.0-dev nlohmann-json3-dev \
            libpango1.0-dev librsvg2-dev libsystemd-dev libwayland-bin \
            libwayland-dev libwayland-egl-backend-dev libxcb-ewmh-dev \
            libxcb-icccm4-dev libxcb-imdkit-dev libxcb-randr0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcb-xinerama0-dev \
            libxcb-xkb-dev libxcb1-dev libxkbcommon-x11-dev \
            libxkbfile-dev ninja-build pkgconf \
            plasma-wayland-protocols unicode-cldr-core uuid-dev \
            wayland-protocols

      - name: Configure
        run: |
          cmake -G Ninja -S . -B build \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            -DCMAKE_CXX_FLAGS="-ffunction-sections -fdata-sections" \
            -DCMAKE_SHARED_LINKER_FLAGS="-Wl,--gc-sections"

      - name: Build
        run: cmake --build build --target Fcitx5Utils

      - name: Package
        id: package
        run: |
          version="5.1.22+release.${GITHUB_SHA::7}"
          pkgroot="$(mktemp -d)"
          libdir="$pkgroot/usr/lib/x86_64-linux-gnu"
          mkdir -p "$libdir" "$pkgroot/DEBIAN"
          install -m644 build/bin/libFcitx5Utils.so.5.1.22 "$libdir/"
          strip --strip-unneeded "$libdir/libFcitx5Utils.so.5.1.22"
          ln -s libFcitx5Utils.so.5.1.22 "$libdir/libFcitx5Utils.so.2"
          size="$(du -sk "$pkgroot" | cut -f1)"
          cat > "$pkgroot/DEBIAN/control" <<EOF
          Package: libfcitx5utils2
          Version: $version
          Architecture: amd64
          Maintainer: Nik-Gleb <nikitosgleb@gmail.com>
          Installed-Size: $size
          Depends: libc6, libgcc-s1, libstdc++6, libsystemd0
          Section: libs
          Priority: optional
          Homepage: https://github.com/fcitx/fcitx5
          Description: Fcitx Input Method Framework v5 (utils library)
           Personal build with the Ctrl+Shift+<non-Latin letter> fix from
           https://github.com/fcitx/fcitx5/pull/1683
          EOF
          deb="libfcitx5utils2_${version}_amd64.deb"
          dpkg-deb --build --root-owner-group "$pkgroot" "$deb"
          echo "deb=$deb" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete release-latest --yes --cleanup-tag || true
          gh release create release-latest "${{ steps.package.outputs.deb }}" \
            --title "Personal build ($(git rev-parse --short HEAD))" \
            --notes "libfcitx5utils2 built from $(git rev-parse --short HEAD)"
